services:
  game:
    build: .
    image: tverdynya-dev:local
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      # Изоляция: node_modules живёт в Docker volume, не устанавливается на ПК
      - tverdynya_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    stdin_open: true
    tty: true

volumes:
  tverdynya_node_modules:
